[project]
name = "gjango-shop"
version = "0.1.0"
description = ""
authors = [
    {name = "Artem Razmyslov",email = "89083284426@mail.ru"}
]
requires-python = ">=3.13"
dependencies = [
    "django (>=5.1,<5.2)",
    "django-bootstrap5 (>=26.2,<27.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ipython (>=9.14.1,<10.0.0)",
    "django-extensions (>=4.1,<5.0)"
]

[tool.black]
line-length = 119
target-version = ['py313']
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.github
  | deploy
  | migrations
  | __pycache__
  | \.mypy_cache
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
force_single_line = true
multi_line_output = 3
include_trailing_comma = true
force_sort_within_sections = true
line_length = 119
skip = [".git", ".venv", "venv", "__pycache__"]
skip_glob = [
    "**/migrations/**",
    "docs/*",
    "*.txt",
    ".git",
    ".github",
    ".venv",
    ".deploy",
    ".mypy_cache",
    ".pytest_cache"
]
combine_as_imports = true
known_first_party = ["homework"]
src_paths = ["src", "test"]

[tool.mypy]
python_version = "3.13"
show_error_codes = true
ignore_missing_imports = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
strict_optional = true
exclude = [".git", ".venv", "venv", "__pycache__"]
exclude_gitignore = true
